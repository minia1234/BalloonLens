<!doctype html>
<!-- Dev harness: runs extension/content.js against a fake chrome.* that replays a bench results.json.
     Checks placement / fitting / scroll / stale-result logic without Chrome extension loading.
     Serve the repo root:  python -m http.server 8799  then open
     http://127.0.0.1:8799/tools/overlay_harness.html?results=/bench_out/<run>/results.json&model=translategemma:4b -->
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <title>BalloonLens overlay harness</title>
  <style>
    body { margin: 0; background: #444; font-family: system-ui, sans-serif; }
    .page { display: flex; flex-direction: column; align-items: center; gap: 40px; padding: 40px 0 400px; }
    img { display: block; }
    #narrow img { width: 520px; }
    /* ?row=1: pages side by side in one row, wider than the window (a horizontal viewer). */
    .page.row { flex-direction: row; align-items: flex-start; width: max-content; padding: 40px 40px 400px; gap: 40px; }
  </style>
</head>
<body>
  <div class="page" id="pages"></div>
  <script>
    const params = new URLSearchParams(location.search);
    const model = params.get("model") || "translategemma:4b";
    if (params.has("row")) document.getElementById("pages").classList.add("row");
    // ?timers=1: animation frames run as timers, for a window that is hidden (rAF stops in a hidden page).
    if (params.has("timers")) window.requestAnimationFrame = (fn) => setTimeout(() => fn(performance.now()), 16);
    const listeners = [];
    const jobs = {};
    let polls = 0;

    window.chrome = {
      runtime: {
        onMessage: { addListener: (fn) => listeners.push(fn) },
        async sendMessage(msg) {
          const ok = (data) => ({ ok: true, data });
          (window.__msgs ||= []).push(msg.type + (msg.jobId ? ` ${msg.jobId}` : "")); // for checks: what the page asked
          switch (msg.type) {
            case "translateImage": {
              const file = decodeURIComponent(msg.url.split("/").pop());
              jobs[file] = { file, start: polls, tgt: msg.opts.tgt };
              return ok({ jobId: file, fetchMs: 1 });
            }
            case "getJob": {
              polls++;
              const job = jobs[msg.jobId];
              const page = window.__results.pages.find((p) => p.file === job.file);
              const tr = page.translations[model] || {};
              const revealed = Math.max(0, polls - job.start - 2); // simulate progressive results
              const segments = page.segments.map((s, i) => {
                const t = tr[s.id];
                return i < revealed && t ? { ...s, tgt: t.text, status: t.status } : { ...s, tgt: null, status: "pending" };
              });
              const done = revealed >= page.segments.length;
              return ok({ id: job.file, status: done ? "done" : "translate", tgt: job.tgt, width: page.size[0], height: page.size[1], segments, timings: {} });
            }
            default:
              return ok({});
          }
        },
      },
      storage: { onChanged: { addListener() {} } },
    };

    async function boot() {
      window.__results = await (await fetch(params.get("results"))).json();
      const pages = document.getElementById("pages");
      for (const p of window.__results.pages) {
        const img = document.createElement("img");
        img.src = `/samples/synthetic/${p.file}`;
        img.style.width = p.size[1] > 3 * p.size[0] ? "600px" : "760px";
        pages.appendChild(img);
      }
      // reading.js first, as the extension injects it: content.js reads BalloonLensReading at run time.
      const reading = document.createElement("script");
      const bust = `?v=${params.get("v") || "0"}`; // the browser caches the scripts; a new v loads the current ones
      reading.src = `/extension/reading.js${bust}`;
      reading.onload = () => {
        const s = document.createElement("script");
        s.src = `/extension/content.js${bust}`;
        s.onload = () => {
          const settings = { src: "ja", tgt: "ko", model, reading: params.get("reading") || "rtl", fontScale: 1, bgOpacity: 0.92, showSource: params.has("src") };
          listeners.forEach((fn) => fn({ type: "bl:start", tabId: 1, settings }, {}, () => {}));
        };
        document.body.appendChild(s);
      };
      document.body.appendChild(reading);
    }
    boot();
  </script>
</body>
</html>
